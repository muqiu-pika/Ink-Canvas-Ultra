name: .NET Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    # 安装 .NET 10 SDK（windows-2025 镜像自带 VS2026 / MSBuild 18，可载 global.json 锁定的 10.0.400）
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: '10.0.x'
        
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3.0.0
      with:
        nuget-version: '5.x'

    # 提取版本号（唯一来源：csproj 的 ApplicationVersion）
    - name: Extract version
      id: version
      run: |
        $csproj = "Ink Canvas\Ink Canvas.csproj"
        [xml]$project = Get-Content $csproj
        # csproj 中存在多个 PropertyGroup，.ApplicationVersion 返回数组，
        # 只有一个 PropertyGroup 包含 ApplicationVersion，其余为 $null，
        # 取第一个非空值，避免数组转字符串时出现多余空格
        $appVersion = ($project.Project.PropertyGroup.ApplicationVersion | Where-Object { $_ } | Select-Object -First 1)
        $version = ($appVersion -replace '\.%\w+$', '').Trim()
        Write-Output "Extracted version: $version"
        "version=$version" >> $env:GITHUB_OUTPUT

    # 版本号同步：exe 内嵌版本（AssemblyInfo）与安装包版本（iss）都取自上面的 ApplicationVersion。
    # 以前这三处需要手工各改一次，漏改一处就会出现"装完新版本、程序里仍显示旧版本号"，
    # 并导致自动更新反复提示同一版本（远端版本 > 本地内嵌版本，永远判定为未更新）。
    - name: Sync version
      run: |
        $version = "${{ steps.version.outputs.version }}"
        if ([string]::IsNullOrWhiteSpace($version)) { Write-Error "版本号为空，终止"; exit 1 }

        # 1) AssemblyInfo.cs -> AssemblyVersion("X.Y.Z.0")（只改未被注释的那一行）
        $assemblyInfo = "Ink Canvas\Properties\AssemblyInfo.cs"
        $text = Get-Content $assemblyInfo -Raw
        $pattern = '(?m)^\[assembly: AssemblyVersion\("\d+(\.\d+){3}"\)\]'
        if (-not [regex]::IsMatch($text, $pattern)) { Write-Error "AssemblyVersion 未找到（文件格式可能已变）"; exit 1 }
        $updated = [regex]::Replace($text, $pattern, "[assembly: AssemblyVersion(""$version.0"")]")
        if ($updated -ne $text) { Set-Content -Path $assemblyInfo -Value $updated -Encoding UTF8 }

        # 2) 安装包脚本 -> #define MyAppVersion "X.Y.Z"
        $iss = "Ink Canvas Ultra-AnyCPU.iss"
        $issText = Get-Content $iss -Raw
        $issPattern = '#define\s+MyAppVersion\s+"[^"]*"'
        if (-not [regex]::IsMatch($issText, $issPattern)) { Write-Error "iss 的 MyAppVersion 未找到"; exit 1 }
        $issUpdated = [regex]::Replace($issText, $issPattern, "#define MyAppVersion ""$version""")
        if ($issUpdated -ne $issText) { Set-Content -Path $iss -Value $issUpdated -Encoding UTF8 }

        Write-Output "版本已同步：AssemblyInfo/iss = $version"

    - name: NuGet restore
      run: nuget restore
      
    # 添加 MSBuild.exe 到环境变量: https://github.com/microsoft/setup-msbuild
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3.0.0

    - name: Build the solution
      run: |
        msbuild -t:restore /p:GitFlow="Github Action"
        msbuild -target:"Ink Canvas" /p:Configuration=Release /p:Platform="Any CPU" /p:GitFlow="Github Action"

    - name: Upload to artifact
      uses: actions/upload-artifact@v7
      with:
        name: Ink.Canvas.Ultra.V${{ steps.version.outputs.version }}
        path: Ink Canvas/bin/Release