name: .NET Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    # 安装 .NET 10 SDK（windows-2025 镜像自带 VS2026 / MSBuild 18，可载 global.json 锁定的 10.0.400）
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: '10.0.x'
        
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3.0.0
      with:
        nuget-version: '5.x'

    # 提取版本号（唯一来源：AssemblyInfo.cs 的 AssemblyVersion，发版只改这一处）
    - name: Extract version
      id: version
      run: |
        $assemblyInfo = "Ink Canvas\Properties\AssemblyInfo.cs"
        $text = Get-Content $assemblyInfo -Raw
        $pattern = '(?m)^\[assembly: AssemblyVersion\("(\d+)\.(\d+)\.(\d+)\.(\d+)"\)\]'
        $m = [regex]::Match($text, $pattern)
        if (-not $m.Success) { Write-Error "AssemblyVersion 未找到（文件格式可能已变）"; exit 1 }
        # version   = X.Y.Z（iss / csproj 用）
        # versionFull = X.Y.Z.0（app.manifest 用）
        $version = "$($m.Groups[1]).$($m.Groups[2]).$($m.Groups[3])"
        $versionFull = "$version.$($m.Groups[4])"
        Write-Output "Extracted version: $versionFull"
        "version=$version" >> $env:GITHUB_OUTPUT
        "versionFull=$versionFull" >> $env:GITHUB_OUTPUT

    # tag 构建防呆：tag 必须与 AssemblyInfo 版本一致（vX.Y.Z），否则安装包文件名
    # 与 tag 对不上，自动更新会 404（发布约定见 README"版本信息"）。
    - name: Verify tag matches version
      if: github.ref_type == 'tag'
      run: |
        $expected = "v${{ steps.version.outputs.version }}"
        $actual = "${{ github.ref_name }}"
        if ($actual -ne $expected) {
          Write-Error "tag '$actual' 与 AssemblyInfo 版本 '$expected' 不一致，终止（tag 必须为 vX.Y.Z 且与 AssemblyVersion 前三段相同）"
          exit 1
        }
        Write-Output "tag 校验通过：$actual"

    # 版本号同步：除 AssemblyInfo（唯一来源，不再改写）外，
    # iss / app.manifest / csproj 全部由本步骤从 AssemblyInfo 派生。
    # 漏改一处就会出现"装完新版本、程序里仍显示旧版本号"，并导致自动更新
    # 反复提示同一版本；也满足 SignPath 对"每次构建所有版本属性一致"的要求。
    - name: Sync version
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $versionFull = "${{ steps.version.outputs.versionFull }}"
        if ([string]::IsNullOrWhiteSpace($version)) { Write-Error "版本号为空，终止"; exit 1 }

        # 1) 安装包脚本 -> #define MyAppVersion "X.Y.Z"
        $iss = "Ink Canvas Ultra-AnyCPU.iss"
        $issText = Get-Content $iss -Raw
        $issPattern = '#define\s+MyAppVersion\s+"[^"]*"'
        if (-not [regex]::IsMatch($issText, $issPattern)) { Write-Error "iss 的 MyAppVersion 未找到"; exit 1 }
        $issUpdated = [regex]::Replace($issText, $issPattern, "#define MyAppVersion ""$version""")
        # utf8BOM：保证各版本 Inno Setup 都按 UTF-8 解析脚本里的中文注释与字符串
        if ($issUpdated -ne $issText) { Set-Content -Path $iss -Value $issUpdated -Encoding utf8BOM }

        # 2) app.manifest -> assemblyIdentity version="X.Y.Z.0"
        #    （只改 assemblyIdentity 的 version，避免误伤 comctl32 依赖的 6.0.0.0）
        $manifest = "Ink Canvas\app.manifest"
        $mText = Get-Content $manifest -Raw
        $mPattern = '(<assemblyIdentity[^>]*?version=")\d+(\.\d+){3}(")'
        if (-not [regex]::IsMatch($mText, $mPattern)) { Write-Error "app.manifest 的 assemblyIdentity version 未找到"; exit 1 }
        $mUpdated = [regex]::Replace($mText, $mPattern, "`${1}$versionFull`${3}")
        if ($mUpdated -ne $mText) { Set-Content -Path $manifest -Value $mUpdated -Encoding UTF8 }

        # 3) csproj（根 + x86）-> ApplicationVersion "X.Y.Z.%2a"
        foreach ($proj in @("Ink Canvas.csproj", "Ink Canvas\Ink Canvas.csproj")) {
          $pText = Get-Content $proj -Raw
          $pPattern = '<ApplicationVersion>[^<]*</ApplicationVersion>'
          if (-not [regex]::IsMatch($pText, $pPattern)) { Write-Error "$proj 的 ApplicationVersion 未找到"; exit 1 }
          $pUpdated = [regex]::Replace($pText, $pPattern, "<ApplicationVersion>$version.%2a</ApplicationVersion>")
          if ($pUpdated -ne $pText) { Set-Content -Path $proj -Value $pUpdated -Encoding UTF8 }
        }

        Write-Output "版本已同步：iss=$version, manifest=$versionFull, csproj=$version.%2a（来源 AssemblyInfo）"

    - name: NuGet restore
      run: nuget restore
      
    # 添加 MSBuild.exe 到环境变量: https://github.com/microsoft/setup-msbuild
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3.0.0

    - name: Build the solution
      run: |
        msbuild -t:restore /p:GitFlow="Github Action"
        msbuild -target:"Ink Canvas" /p:Configuration=Release /p:Platform="Any CPU" /p:GitFlow="Github Action"

    # 清理产物中的调试符号：pdb 只在调试时有意义，运行不需要，
    # 打进 artifact zip 只会白白增大产物体积（安装包 iss 早已排除 pdb/stdole）
    - name: Remove debug symbols from output
      run: |
        Get-ChildItem "Ink Canvas/bin/Release" -Filter *.pdb -Recurse | Remove-Item -Force
        Get-ChildItem "Ink Canvas/bin/Release" -Filter "Interop.stdole.dll" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

    # 安装包打包：Inno Setup（每次构建都打包，尽早暴露 iss 脚本问题；
    # 正式 Release 由下方的 release job 仅在 tag 构建时创建）
    - name: Install Inno Setup
      run: |
        choco install innosetup -y --no-progress
        $dir = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "Inno Setup*" | Select-Object -First 1
        if (-not $dir) { Write-Error "Inno Setup 安装目录未找到"; exit 1 }
        $iscc = Join-Path $dir.FullName "ISCC.exe"
        if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe 未找到：$($dir.FullName)"; exit 1 }
        Write-Output "ISCC: $iscc"
        "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

        # choco 静默安装不含可选的翻译文件（官方安装器中翻译是可选组件），
        # 而 .iss 引用了简体中文翻译，缺失会让 ISCC 直接编译中止 —— 从官方源码仓库补齐
        $langDir = Join-Path $dir.FullName "Languages"
        $islPath = Join-Path $langDir "ChineseSimplified.isl"
        if (-not (Test-Path $islPath)) {
          New-Item -ItemType Directory -Force -Path $langDir | Out-Null
          $urls = @(
            "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_1/Files/Languages/Unofficial/ChineseSimplified.isl",
            "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl"
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile $islPath -UseBasicParsing -TimeoutSec 60
              if ((Get-Item $islPath).Length -gt 10KB) { $ok = $true; Write-Output "已补齐翻译文件：$u"; break }
            } catch { Write-Output "下载失败：$u" }
          }
          if (-not $ok) { Write-Error "ChineseSimplified.isl 补齐失败"; exit 1 }
        }

    - name: Build installer (Inno Setup)
      run: |
        & "${{ env.ISCC_PATH }}" "Ink Canvas Ultra-AnyCPU.iss"
        if ($LASTEXITCODE -ne 0) { Write-Error "ISCC 编译失败"; exit 1 }
        Get-ChildItem dist | Format-Table Name, Length

    - name: Upload to artifact
      uses: actions/upload-artifact@v7
      with:
        name: Ink.Canvas.Ultra.V${{ steps.version.outputs.version }}
        path: Ink Canvas/bin/Release

    - name: Upload installer artifact
      uses: actions/upload-artifact@v7
      with:
        name: Ink.Canvas.Ultra.V${{ steps.version.outputs.version }}.Setup
        path: dist/*.exe
        if-no-files-found: error

  # tag 构建（vX.Y.Z）：产出草稿 Release 并附上安装包。
  # 默认 draft=true，由维护者在 Releases 页检查文件名（必须为
  # Ink.Canvas.Ultra.V{版本}.Setup.exe）并填写发布说明后再手动发布。
  release:
    name: Create draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v7
        with:
          name: Ink.Canvas.Ultra.V${{ needs.build.outputs.version }}.Setup
          path: dist

      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.4
        with:
          draft: true
          name: Ink Canvas Ultra V${{ needs.build.outputs.version }}
          body: |
            自动构建的安装包（CI 产物，发布说明请在发布前参照 `docs/release-notes-template.md` 填写）。

            ### 📥 下载
            - 安装包：`Ink.Canvas.Ultra.V${{ needs.build.outputs.version }}.Setup.exe`
          files: dist/*.exe
          fail_on_unmatched_files: true